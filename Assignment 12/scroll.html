<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 12 - Scrollable Box</title>
    <style>
        .scroll-box {
            height: 120px;
            overflow: auto;
            border: 2px solid #243b53;
            padding: 10px;
            width: 220px;
            background-color: #f8fafc;
            font-family: Arial, sans-serif;
        }
        .scroll-box p {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="scroll-box">
        <p>Line 1</p>
        <p>Line 2</p>
        <p>Line 3</p>
        <p>Line 4</p>
        <p>Line 5</p>
    </div>
</body>
</html>
