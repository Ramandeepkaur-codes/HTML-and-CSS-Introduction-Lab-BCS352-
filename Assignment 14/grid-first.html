<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 14 - Grid First</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            font-family: Arial, sans-serif;
        }
        .box {
            background-color: #dbeafe;
            border: 1px solid #3b82f6;
            padding: 30px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #1e40af;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Three Equal Columns Grid</h1>
    <div class="grid-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
</body>
</html>
