<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 13 - Wrapping Cards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .card {
            background-color: #e0f2fe;
            border: 1px solid #0284c7;
            border-radius: 6px;
            padding: 15px;
            width: 150px;
            text-align: center;
            box-sizing: border-box;
        }
        .card h3 {
            margin-top: 0;
            color: #0369a1;
        }
        .card p {
            margin-bottom: 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Stationery Shop</h1>
    <div class="row">
        <div class="card">
            <h3>Notebook</h3>
            <p>Price: 60</p>
        </div>
        <div class="card">
            <h3>Pen</h3>
            <p>Price: 15</p>
        </div>
        <div class="card">
            <h3>Bag</h3>
            <p>Price: 350</p>
        </div>
        <div class="card">
            <h3>Book</h3>
            <p>Price: 120</p>
        </div>
    </div>
</body>
</html>
